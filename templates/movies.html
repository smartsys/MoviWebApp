{% extends "base.html" %}
{% block content %}
<h1>Movies</h1>
<ul class="movie-list">
    {% for movie in movies %}
    <li class="movie-entry">

        {% if movie.poster_url %}
        <img src="{{ movie.poster_url }}" alt="Poster of {{ movie.name }}" width="100">
        {% endif %}

        {{ movie.name }}{% if movie.year %} ({{ movie.year }}){% endif %}

        {% if movie.director %}by {{ movie.director }}{% endif %}

        <form action="{{ url_for('update_movie', user_id=user_id, movie_id=movie.id) }}" method="post">
            <input type="text" name="title" value="{{ movie.name }}" aria-label="New title" required>
            <button type="submit">Update</button>
        </form>

        <form action="{{ url_for('delete_movie', user_id=user_id, movie_id=movie.id) }}" method="post">
            <button type="submit">Delete</button>
        </form>

    </li>
    {% endfor %}
</ul>

<form action="{{ url_for('add_movie', user_id=user_id) }}" method="post">
    <label for="title">Title</label>
    <input type="text" id="title" name="title" required>
    <label for="year">Year</label>
    <input type="number" id="year" name="year">
    <button type="submit">Add movie</button>
</form>

{% endblock %}
